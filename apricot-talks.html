  <style>
    :root { --ink: #2c3e50; --paper: #FDFBF7; --red-apricot: #E53935; }
    body { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; background: var(--paper); color: var(--ink); margin: 0; padding: 0; line-height: 1.6; }
    .wobbly-border { border: 2px solid var(--ink); border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; }
    .wobbly-btn { display: inline-block; padding: 10px 20px; color: var(--ink); text-decoration: none; font-weight: bold; background: transparent; border: 2px solid var(--ink); border-radius: 15px 225px 15px 255px/255px 15px 225px 15px; box-shadow: 4px 4px 0px var(--red-apricot); transition: all 0.2s; cursor: pointer; }
    .wobbly-btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--red-apricot); }
    .btn-filled { background: var(--red-apricot); color: #fff; box-shadow: 4px 4px 0px var(--ink); border-color: var(--ink); }
    .btn-filled:hover { color: #fff; box-shadow: 2px 2px 0px var(--ink); }
    
    header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--ink); position: sticky; top: 0; background: var(--paper); z-index: 100; }
    .logo { font-size: 1.8rem; font-weight: bold; display: flex; align-items: center; gap: 10px; color: var(--red-apricot); }
    .logo svg { width: 35px; height: 35px; stroke: var(--red-apricot); stroke-width: 2; fill: none; }
    
    .header-nav { display: flex; align-items: center; gap: 30px; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: var(--ink); font-weight: bold; text-decoration: none; border-bottom: 2px dashed transparent; transition: all 0.2s; }
    .nav-links a:hover { border-bottom: 2px dashed var(--red-apricot); color: var(--red-apricot); }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    .hero { text-align: center; margin-bottom: 80px; padding-top: 40px; }
    .hero h1 { font-size: 3.5rem; margin-bottom: 20px; position: relative; display: inline-block; }
    .hero h1::after { content: ""; position: absolute; bottom: 5px; left: 0; width: 100%; height: 10px; background: rgba(229, 57, 53, 0.2); z-index: -1; transform: rotate(-1deg); }
    .hero-actions { display: flex; gap: 20px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
    
    .section-title { text-align: center; margin-bottom: 40px; font-size: 2.2rem; scroll-margin-top: 100px; }
    
    .masonry { column-count: 3; column-gap: 30px; margin-bottom: 80px; }
    .masonry-card { break-inside: avoid; background: #fff; padding: 25px; margin-bottom: 30px; position: relative; }
    .masonry-card h3 { color: var(--red-apricot); font-size: 1.3rem; margin-top: 0; }
    .icon-sketch { width: 40px; height: 40px; stroke: var(--ink); stroke-width: 1.5; fill: none; margin-bottom: 15px; }
    
    .pricing { display: flex; gap: 30px; margin-bottom: 80px; }
    .price-card { flex: 1; padding: 30px; text-align: center; background: #fff; display: flex; flex-direction: column; }
    .price-card.featured { transform: scale(1.05); background: #FFF9C4; }
    .price { font-size: 2.5rem; color: var(--red-apricot); font-weight: bold; margin: 20px 0; }
    ul.sketch-list { list-style: none; padding: 0; text-align: left; margin-bottom: 30px; flex-grow: 1; }
    ul.sketch-list li { margin-bottom: 10px; padding-left: 25px; position: relative; }
    ul.sketch-list li::before { content: "»"; position: absolute; left: 0; color: var(--red-apricot); font-weight: bold; }
    
    .faq-list, .testi-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 80px; }
    .testi-card { font-style: italic; }
    .testi-author { font-weight: bold; color: var(--red-apricot); font-style: normal; text-align: right; margin-top: 10px; }
    
    footer { border-top: 2px dashed var(--ink); padding: 40px 20px; text-align: center; }
    .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .footer-links a { color: var(--ink); text-decoration: none; text-decoration-style: dashed; }
    
    @media (max-width: 768px) {
      .masonry { column-count: 1; }
      .pricing { flex-direction: column; }
      .price-card.featured { transform: none; }
      .hero h1 { font-size: 2.5rem; }
      .nav-links { display: flex !important; overflow-x: auto; white-space: nowrap; width: 100%; order: 3; padding-top: 12px; padding-bottom: 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; gap: 15px; } .nav-links::-webkit-scrollbar { display: none; } header .container { flex-wrap: wrap; }
    }
  

    /* SEO Links Customization */
    .seo-content a { color: var(--red-apricot) !important; text-decoration: none; font-weight: bold; transition: opacity 0.3s; }
    .seo-content a:visited { color: var(--red-apricot) !important; }
    .seo-content a:hover { opacity: 0.7; }
    .seo-content h1, .seo-content h2, .seo-content h3 { margin-top: 1.5em; margin-bottom: 0.5em; }
    .seo-content p { margin-bottom: 1.5em; font-size: 1.1rem; line-height: 1.8; }
    .seo-content ul { margin-bottom: 1.5em; line-height: 1.8; font-size: 1.1rem; }
    
    /* Blog Roll Card Grid */
    .article-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-top: 40px; }
    .article-card { background: #fff; padding: 30px; text-decoration: none; display: flex; flex-direction: column; border: 2px solid var(--ink); border-radius: 15px 225px 15px 255px/255px 15px 225px 15px; box-shadow: 4px 4px 0px var(--red-apricot); transition: all 0.2s; }
    .article-card:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--red-apricot); }
    .article-card h3 { color: var(--red-apricot); font-size: 1.3rem; font-weight: bold; line-height: 1.5; margin: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
    .article-card-read { margin-top: auto; padding-top: 15px; font-size: 0.9rem; color: var(--red-apricot); font-weight: bold; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
    </style>
